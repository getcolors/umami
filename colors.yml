# Desired state for umami-digitalocean. Non-secret values only.
# Credentials belong in the gitignored .envrc.private as COLORS_PAR_* variables.
# Never export COLORS_PAR_PROFILE: it selects this deployment's remote state.
#
# Required credentials:
#   DigitalOcean       COLORS_PAR_DO_TOKEN
#   Cloudflare         COLORS_PAR_CLOUDFLARE_API_TOKEN
#   state in R2        COLORS_PAR_R2_ACCESS_KEY_ID
#                      COLORS_PAR_R2_SECRET_ACCESS_KEY
#   backups in R2      COLORS_PAR_BACKUP_R2_ACCESS_KEY_ID
#                      COLORS_PAR_BACKUP_R2_SECRET_ACCESS_KEY
#   database & secret  COLORS_PAR_POSTGRES_PASSWORD
#                      COLORS_PAR_APP_SECRET_KEY

profile: umami-digitalocean
workdir: .colors

provider-compute: digitalocean
provider-dns: cloudflare
provider-backend: r2

# Preserve this guard in committed desired state. Destruction requires an
# explicitly authorized one-run override; never edit this flag to bypass it.
compute-prevent-destroy: true

# --- Umami Service -----------------------------------------------------------

umami-host: umami.bigconfig.online
umami-version: v2.14.0
umami-port: 3000

postgres-version: 17
postgres-port: 5432
postgres-database: umami
postgres-user: umami
postgres-data-dir: /var/lib/umami/postgres

caddy-image: caddy:2.11.4

# --- Backups -----------------------------------------------------------------

backup-r2-bucket: umami-backup
backup-r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com
backup-r2-region: auto
backup-oncalendar: "*-*-* 03:00:00"
backup-retention-days: 7
backup-dir: /var/backups/umami

# --- DigitalOcean ------------------------------------------------------------

digitalocean-name: umami-digitalocean
digitalocean-region: ams3
digitalocean-size: s-4vcpu-8gb
digitalocean-image: ubuntu-24-04-x64
digitalocean-ssh-keys: "58495393"

digitalocean-ssh-sources:
  - 0.0.0.0/0
  - "::/0"
digitalocean-http-sources:
  - 0.0.0.0/0
  - "::/0"
digitalocean-https-sources:
  - 0.0.0.0/0
  - "::/0"

# --- Public DNS and TLS ------------------------------------------------------

cloudflare-zone: bigconfig.online
cloudflare-record-name: umami
cloudflare-proxied: false

# --- OpenTofu State Backend --------------------------------------------------

r2-bucket: tofu-state-319271fed8bc6d2d9059362be1165f37-eu
r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com

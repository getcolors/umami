services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: "{{ lookup('env','COLORS_PAR_POSTGRES_PASSWORD') | default('umami', true) }}"
    volumes:
      - /var/lib/umami/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.14.0
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://umami:{{ lookup('env','COLORS_PAR_POSTGRES_PASSWORD') | default('umami', true) }}@postgres:5432/umami"
      DATABASE_TYPE: postgresql
      APP_SECRET: "{{ lookup('env','COLORS_PAR_APP_SECRET_KEY') | default(lookup('env','COLORS_PAR_UMAMI_APP_SECRET') | default('umami_secret_hash_key_63829104829104', true), true) }}"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [umami]
    networks: [internal]

networks:
  internal:
    internal: false
volumes:
  caddy-data:
  caddy-config:
